name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest

    env:
      # Dummy value: tests mock Prisma and never open a real connection.
      # prisma generate only needs a syntactically valid URL, not a live one.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test
